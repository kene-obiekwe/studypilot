services:
  - type: web
    name: studypilot-api
    runtime: python
    plan: free
    region: oregon
    branch: master
    autoDeployTrigger: commit
    rootDir: backend
    # Migrations run in the build, not at start: the free plan has no pre-deploy command, and a failed
    # migration here fails the build, so the new version never starts and the old one keeps serving.
    # Doing it at start would also repeat it on every wake from sleep and lengthen the cold start.
    # The same goes for the housekeeping after it (free has no cron): expired refresh-token rows and
    # unverified accounts older than 7 days are removed on each deploy.
    buildCommand: >-
      pip install -r requirements.txt
      && python manage.py collectstatic --noinput
      && python manage.py migrate --noinput
      && python manage.py flushexpiredtokens
      && python manage.py purge_unverified_accounts
      && python manage.py createcachetable
    startCommand: gunicorn config.wsgi -c gunicorn.conf.py
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Neon connection string (sslmode=require). Secret.
      - key: DATABASE_URL
        sync: false
      # Render's own hostname is added automatically; add the custom domain here if you use one.
      - key: ALLOWED_HOSTS
        sync: false
      # The Vercel origin, scheme included and no trailing slash, e.g. https://studypilot.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
      - key: AUTH_THROTTLE_RATE
        value: 10/minute
      - key: EMAIL_THROTTLE_RATE
        value: 5/hour
      - key: JWT_ACCESS_MINUTES
        value: "30"
      - key: JWT_REFRESH_DAYS
        value: "1"
      # Optional AI-written plans. Leave the key blank to serve rules-only plans.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Blank uses the built-in default model.
      - key: AI_PLAN_MODEL
        sync: false
      - key: AI_PLAN_DAILY_LIMIT
        value: "20"
      - key: AI_PLAN_TIMEOUT_SECONDS
        value: "20"
      # Outgoing email (see docs/deploy.md: Render's free plan blocks SMTP ports 25, 465 and 587; use 2525).
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Seconds before a stuck mail connection is abandoned.
      - key: EMAIL_TIMEOUT
        value: "10"
